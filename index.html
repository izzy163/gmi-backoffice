<style>

  --shadow:0 18px 50px rgba(0,0,0,.55); --nav-bg:#0b1322; --nav-fg:#e4e9ee; --nav-muted:#8a9bb5; --nav-active:#1c3156;
  --h1:#ff8a5c; --h2:#6cb6f0; --h3:#64c48d; --h4:#b894f2; --h5:#e6b45a; --h6:#f080ad; color-scheme:dark}}

.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;border:1.5px solid var(--fg);border-radius:3px;padding:0 5px;line-height:1.5;white-space:nowrap}
.badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--info-soft);color:var(--muted)}
.b-good{background:var(--good-soft);color:var(--good)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.spec{display:inline-block;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:3px;padding:0 5px;margin:2px 4px 0 0}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}

.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:27px;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.tile .d{color:var(--muted);font-size:12.5px;margin-top:3px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}

.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:40}

.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}

.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px;background:var(--surface);border-top:1px solid var(--line)}
.df .grp{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical}

.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}

.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}

.inline .btn{flex:0 0 auto}
.log{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.log .ent{border-left:2px solid var(--line);padding-left:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CATS=['Cooking','Ovens','Refrigeration','Ice machines','Warewashing','Food prep','Ventilation & hoods','Sinks & tables','Smallwares','Other'];
const CONDS=['New','Open box','Used – A','Used – B','Used – C','As-is / parts'];
const USTAT=['Available','On hold','In repair','Sold'];
const FUEL=['Electric','Gas – NG','Gas – LP','Gas – NG/LP','No utility'];
const STAGES=['Lead','Prospect','Customer','Inactive'];
const SOURCES=['Walk-in','Phone','Website','Referral','Google','Marketplace','Repeat customer','Other'];
const JTYPES=['Install','Service call','Repair','Warranty','Maintenance','Delivery','Kitchen design'];
const JSTAT=['Scheduled','In progress','Waiting on parts','Done','Cancelled'];
const STYPES=['Restaurant closing','Auction','Dealer','Manufacturer / rep','Liquidator','Individual','Other'];
const ECATS=['Rent','Utilities','Payroll','Truck & fuel','Parts & supplies','Marketing','Insurance','Software','Tools','Repairs & maintenance','Professional fees','Other'];
const PAYM=['Cash','Check','Card','ACH / wire','Zelle','Financing','Other'];
const OSTAT={quote:'Quote',order:'Sales order',invoiced:'Invoice',void:'Void'};
const ACTS=['Call','Email','Text','Visit','Note'];

/* ---------- state ---------- */
const S={products:[],units:[],customers:[],suppliers:[],orders:[],jobs:[],expenses:[]};
let settings={};
let db=null, canWrite=true, conn='connecting';
let lastErr='';
const UI={view:'dashboard',q:{},filter:{units:'stock',orders:'open',jobs:'open'},custMode:'list',money:'pl'};
let drawer=null; // {kind, coll, id, draft}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const fmt0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const money=n=>fmt.format(+n||0), money0=n=>fmt0.format(+n||0);
const n2=v=>{const x=Number(v);return isFinite(x)?x:0};
const r2=x=>Math.round(x*100)/100;
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(iso,n){if(!iso)return'';const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function daysSince(iso){if(!iso)return null;return Math.floor((new Date(today()+'T12:00:00')-new Date(iso+'T12:00:00'))/864e5)}
function fdate(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
const byId=(c,id)=>S[c].find(x=>x.id===id);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function nextNum(coll,key,start){let m=start-1;for(const d of S[coll]){const v=parseInt(String(d[key]??'').replace(/\D/g,''),10);if(v>m)m=v}return m+1}
const custName=id=>{const c=byId('customers',id);return c?(c.company||c.name||'Unnamed'):''};
const LABEL={
  units:u=>`${u.tag||''} · ${u.title||[u.brand,u.model].filter(Boolean).join(' ')||'Unit'}`,
  products:p=>[p.brand,p.model,p.name].filter(Boolean).join(' · ')||'Item',
  customers:c=>c.company?(c.company+(c.name?' ('+c.name+')':'')):(c.name||'Unnamed'),
  suppliers:s=>s.name||'Unnamed',
  orders:o=>`#${o.number} ${custName(o.customerId)}`
};
function refItems(c){return S[c].map(d=>[d.id,LABEL[c](d)]).sort((a,b)=>a[1].localeCompare(b[1]))}
function badge(text,kind){return `<span class="badge ${kind?'b-'+kind:''}">${esc(text)}</span>`}

const stageBadge=s=>badge(s||'—',{Lead:'acc',Prospect:'warn',Customer:'good',Inactive:''}[s]);
const jobBadge=s=>badge(s||'—',{Scheduled:'acc','In progress':'warn','Waiting on parts':'bad',Done:'good',Cancelled:''}[s]);
function utitle(u){return u.title||[u.brand,u.model].filter(Boolean).join(' ')||'Untitled unit'}
const COSTK=['cost','freight','palletizing','repairLabor','repairParts'];
function landed(u){return r2(COSTK.reduce((a,k)=>a+n2(u[k]),0))}
function costBox(u){const L=landed(u),p=n2(u.price);const rows=[['Purchase cost','cost'],['Freight in','freight'],['Palletizing / crating','palletizing'],['Repair labor','repairLabor'],['Repair parts','repairParts']];return `<div class="kv">${rows.map(([l,k])=>`<dt>${l}</dt><dd>${money(u[k])}</dd>`).join('')}<dt><strong>Landed cost</strong></dt><dd><strong>${money(L)}</strong></dd>${p?`<dt>Profit at asking</dt><dd class="${p-L<0?'neg':'pos'}">${money(p-L)} · ${Math.round((p-L)/p*100)}%</dd>`:''}</div>`}
const CATHUE={'Cooking':'--h1','Ovens':'--h5','Refrigeration':'--h2','Ice machines':'--h2','Warewashing':'--h4','Food prep':'--h3','Ventilation & hoods':'--h6','Sinks & tables':'--h4','Smallwares':'--h5'};

/* ---------- order math ---------- */
function rate(o){return o.taxExempt?0:n2(o.taxRate!=null&&o.taxRate!==''?o.taxRate:(settings.taxRate??6.625))}
function calc(o){
  let sub=0,taxable=0,cost=0;
  for(const l of (o.lines||[])){const q=n2(l.qty||0),p=n2(l.price);sub+=q*p;cost+=q*n2(l.cost);if(l.taxable!==false)taxable+=q*p}
  const tax=r2(taxable*rate(o)/100), total=r2(sub+tax), paid=r2((o.payments||[]).reduce((a,p)=>a+n2(p.amount),0));
  return {sub:r2(sub),tax,total,cost:r2(cost),paid,balance:r2(total-paid),profit:r2(sub-cost),margin:sub?(sub-cost)/sub:0};
}
function ostatus(o){if(o.status==='invoiced'){return calc(o).balance<=0.004?'paid':'invoiced'}return o.status||'quote'}
function obadge(o){const s=ostatus(o);return badge({quote:'Quote',order:'Sales order',invoiced:'Unpaid invoice',paid:'Paid',void:'Void'}[s],{quote:'acc',order:'warn',invoiced:'bad',paid:'good',void:''}[s])}
function warrantyEnd(o){return o&&o.deliveredDate?addDays(o.deliveredDate,n2(settings.warrantyDays||90)):''}

function renderNav(){
  const co=settings.companyName||'Back Office';

   VIEWS.map(([v,l,c])=>`<button data-view="${v}" class="${UI.view===v?'active':''}">${l}${c?`<span class="count">${S[c].length||''}</span>`:''}</button>`).join('')+
   `<div class="spacer"></div><div class="who" title="${esc(me&&me.email||'')}">${esc(me&&me.email||'')}</div><div class="conn"><span class="dot ${conn==='ok'?'ok':conn==='off'?'bad':''}"></span>${conn==='ok'?'Synced':conn==='off'?'Offline — retrying':'Connecting…'}</div><button data-act="signout">Sign out</button>`;
}
$('#nav').addEventListener('click',e=>{const so=e.target.closest('[data-act="signout"]');if(so){signOut();return}const b=e.target.closest('[data-view]');if(!b)return;UI.view=b.dataset.view;try{history.replaceState(null,'','#'+UI.view)}catch(_){}render();window.scrollTo(0,0)});

/* ---------- main render ---------- */
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function render(){
  const ae=document.activeElement, aid=ae&&ae.closest&&ae.closest('#main')?ae.id:null, sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  renderNav();
  const v=VIEWS_R[UI.view]||VIEWS_R.dashboard;
  let banner='';
  if(conn==='off')banner=`<div class="banner">Can't reach the database right now. ${lastErr?'<strong>'+esc(lastErr)+'</strong>. ':''}${/does not exist|schema cache|404/i.test(lastErr||'')?'It looks like the tables have not been created: run schema.sql in Supabase → SQL Editor.':'This page retries on its own.'}</div>`;
  $('#main').innerHTML=banner+v();
  if(aid){const el=document.getElementById(aid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
}
function pageHead(title,sub,btn){return `<div class="page-h"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${btn&&canWrite?btn:''}</div>`}
function searchBox(key,ph){return `<input class="search" id="q_${key}" data-q="${key}" type="search" placeholder="${ph}" value="${esc(UI.q[key]||'')}">`}
function chips(key,list){return `<div class="chips">${list.map(([v,l,n])=>`<button class="chip ${UI.filter[key]===v?'on':''}" data-chip="${key}" data-v="${v}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`}
function matchQ(key,d){const q=(UI.q[key]||'').trim().toLowerCase();if(!q)return true;return JSON.stringify(d).toLowerCase().includes(q)}
function table(cols,rows,coll,emptyHtml){
  if(!rows.length)return `<div class="tablewrap"><div class="empty">${emptyHtml}</div></div>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'num':''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="row" tabindex="0" data-open="${coll}" data-id="${esc(r.id)}">${cols.map(c=>`<td class="${c.n?'num':''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

  const avail=S.units.filter(u=>u.status!=='Sold');

  const quotes=S.orders.filter(o=>o.status==='quote'), qv=quotes.reduce((a,o)=>a+calc(o).total,0);
  const unpaid=S.orders.filter(o=>ostatus(o)==='invoiced'), ar=unpaid.reduce((a,o)=>a+calc(o).balance,0);
  const overdue=unpaid.filter(o=>daysSince(o.invoiceDate||o.date)>30).length;
  const m=today().slice(0,7), mo=S.orders.filter(o=>o.status==='invoiced'&&(o.invoiceDate||o.date||'').startsWith(m));
  const ms=mo.reduce((a,o)=>a+calc(o).sub,0), mp=mo.reduce((a,o)=>a+calc(o).profit,0);

    <div class="tile" style="--tile:var(--h3)"><div class="k">Sales this month</div><div class="v">${money0(ms)}</div><div class="d">${money0(mp)} gross profit${ms?` · ${Math.round(mp/ms*100)}%`:''}</div></div>
  </div>
  <div class="panels">
    <div class="panel"><h2>Follow-ups due</h2>${plist(fups.map(c=>item('customers',c.id,esc(LABEL.customers(c))+' '+stageBadge(c.stage),`<span class="${c.nextFollowUp<t?'neg':''}">${fdate(c.nextFollowUp)}</span>`)),'No follow-ups due. Set a follow-up date on a customer to see it here.')}</div>
    <div class="panel"><h2>Open service & installs</h2>${plist(jobs.map(j=>item('jobs',j.id,`<span class="tag">${esc(j.num||'')}</span> ${esc(j.type||'Job')} · ${esc(custName(j.customerId))} ${jobBadge(j.status)}`,fdate(j.date))),'No open jobs.')}</div>
    <div class="panel"><h2>Unpaid invoices</h2>${plist(unpaid.sort((a,b)=>(a.invoiceDate||'').localeCompare(b.invoiceDate||'')).map(o=>{const d=daysSince(o.invoiceDate||o.date);return item('orders',o.id,`#${esc(o.number)} ${esc(custName(o.customerId))} <span class="small ${d>30?'neg':'muted'}">${d} days</span>`,money(calc(o).balance))}),'Nothing outstanding.')}</div>

VIEWS_R.money=function(){
  const tabs=[['pl','Profit & loss'],['ar','Receivables'],['pay','Payments in'],['exp','Expenses'],['tax','Sales tax']];
  let body='';
  const inv=S.orders.filter(o=>o.status==='invoiced');
  if(UI.money==='pl'){
    const months=[];const d=new Date();for(let i=0;i<12;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
    const rowsData=months.map(m=>{const os=inv.filter(o=>(o.invoiceDate||o.date||'').startsWith(m));const rev=os.reduce((a,o)=>a+calc(o).sub,0),cogs=os.reduce((a,o)=>a+calc(o).cost,0),ex=S.expenses.filter(e=>(e.date||'').startsWith(m)).reduce((a,e)=>a+n2(e.amount),0);return {m,rev,cogs,gp:rev-cogs,ex,net:rev-cogs-ex,n:os.length}});
    const tot=rowsData.reduce((a,r)=>({rev:a.rev+r.rev,cogs:a.cogs+r.cogs,gp:a.gp+r.gp,ex:a.ex+r.ex,net:a.net+r.net}),{rev:0,cogs:0,gp:0,ex:0,net:0});
    const mx=Math.max(1,...rowsData.map(r=>r.rev));
    const ml=m=>new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
    body=`<div class="tiles"><div class="tile" style="--tile:var(--h2)"><div class="k">Sales, 12 mo</div><div class="v">${money0(tot.rev)}</div></div><div class="tile" style="--tile:var(--h3)"><div class="k">Gross profit</div><div class="v">${money0(tot.gp)}</div><div class="d">${tot.rev?Math.round(tot.gp/tot.rev*100)+'% margin':''}</div></div><div class="tile" style="--tile:var(--h5)"><div class="k">Expenses</div><div class="v">${money0(tot.ex)}</div></div><div class="tile" style="--tile:var(--h4)"><div class="k">Net</div><div class="v ${tot.net<0?'neg':''}">${money0(tot.net)}</div></div></div>
    <div class="tablewrap"><table><thead><tr><th>Month</th><th class="num">Invoices</th><th class="num">Sales</th><th class="num">Cost of goods</th><th class="num">Gross profit</th><th class="num">Expenses</th><th class="num">Net</th></tr></thead><tbody>${rowsData.map(r=>`<tr><td>${ml(r.m)}<div class="bar" style="width:120px"><i style="width:${r.rev/mx*100}%"></i></div></td><td class="num">${r.n||''}</td><td class="num">${money0(r.rev)}</td><td class="num">${money0(r.cogs)}</td><td class="num">${money0(r.gp)}</td><td class="num">${money0(r.ex)}</td><td class="num ${r.net<0?'neg':''}">${money0(r.net)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Sales are invoice subtotals before tax, by invoice date. Cost of goods is the cost you entered on each line (pulled from the unit's cost when sold from inventory). This is a management view, not a tax return.</p>`;
  } else if(UI.money==='ar'){
    const b={c:0,a:0,b:0,d:0};const rows=inv.map(o=>({o,c:calc(o),age:daysSince(o.invoiceDate||o.date)||0})).filter(r=>r.c.balance>0.004).sort((x,y)=>y.age-x.age);
    rows.forEach(r=>{const k=r.age<=30?'c':r.age<=60?'a':r.age<=90?'b':'d';b[k]+=r.c.balance});
    body=`<div class="tiles"><div class="tile" style="--tile:var(--h3)"><div class="k">0–30 days</div><div class="v">${money0(b.c)}</div></div><div class="tile" style="--tile:var(--h5)"><div class="k">31–60 days</div><div class="v">${money0(b.a)}</div></div><div class="tile" style="--tile:var(--h1)"><div class="k">61–90 days</div><div class="v ${b.b?'neg':''}">${money0(b.b)}</div></div><div class="tile" style="--tile:var(--h6)"><div class="k">Over 90</div><div class="v ${b.d?'neg':''}">${money0(b.d)}</div></div></div>`+
    table([{l:'Invoice',v:r=>`<span class="mono">#${esc(r.o.number)}</span>`},{l:'Customer',v:r=>esc(custName(r.o.customerId))},{l:'Invoiced',v:r=>fdate(r.o.invoiceDate||r.o.date)},{l:'Age',n:1,v:r=>`<span class="${r.age>30?'neg':''}">${r.age} days</span>`},{l:'Total',n:1,v:r=>money(r.c.total)},{l:'Balance',n:1,v:r=>`<strong>${money(r.c.balance)}</strong>`}],
     rows.map(r=>({...r,id:r.o.id})),'orders','<strong>Nobody owes you money.</strong>');
  } else if(UI.money==='pay'){
    const pays=[];S.orders.forEach(o=>(o.payments||[]).forEach(p=>pays.push({...p,o,id:o.id})));pays.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const m=today().slice(0,7), mt=pays.filter(p=>(p.date||'').startsWith(m)).reduce((a,p)=>a+n2(p.amount),0);
    body=`<p class="sub" style="margin-bottom:12px">${money(mt)} received this month. Record payments inside each invoice.</p>`+table([{l:'Date',v:p=>fdate(p.date)},{l:'Invoice',v:p=>`<span class="mono">#${esc(p.o.number)}</span>`},{l:'Customer',v:p=>esc(custName(p.o.customerId))},{l:'Method',v:p=>esc(p.method||'')},{l:'Note',v:p=>esc(p.note||'')},{l:'Amount',n:1,v:p=>money(p.amount)}],pays,'orders','<strong>No payments recorded yet.</strong>');
  } else if(UI.money==='exp'){
    const rows=S.expenses.filter(e=>matchQ('expenses',e)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const m=today().slice(0,7), mt=S.expenses.filter(e=>(e.date||'').startsWith(m)).reduce((a,e)=>a+n2(e.amount),0);
    body=`<div class="toolbar">${searchBox('expenses','Search expenses…')}${canWrite?'<button class="btn primary" data-new="expenses">+ Add expense</button>':''}</div><p class="small muted">${money(mt)} this month. Equipment you buy to resell goes on the unit's cost in Inventory, not here.</p>`+
     table([{l:'Date',v:e=>fdate(e.date)},{l:'Paid to',v:e=>esc(e.vendor||'')},{l:'Category',v:e=>esc(e.category||'')},{l:'Method',v:e=>esc(e.method||'')},{l:'Notes',v:e=>`<span class="small">${esc(e.notes||'')}</span>`},{l:'Amount',n:1,v:e=>money(e.amount)}],rows,'expenses',loadingOr('expenses','<strong>No expenses yet.</strong>Log rent, fuel, parts and other overhead to see real net profit.'));
  } else {
    const q=[];const d=new Date();for(let i=0;i<6;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);q.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
    body=`<p class="small muted">Sales tax charged on invoices, by invoice month. Check the amounts against your filings; exempt sales are listed separately.</p><div class="tablewrap"><table><thead><tr><th>Month</th><th class="num">Taxable sales</th><th class="num">Exempt sales</th><th class="num">Tax charged</th></tr></thead><tbody>${q.map(m=>{const os=inv.filter(o=>(o.invoiceDate||o.date||'').startsWith(m));let tx=0,ex=0,t=0;os.forEach(o=>{const c=calc(o);if(o.taxExempt)ex+=c.sub;else{const tb=(o.lines||[]).filter(l=>l.taxable!==false).reduce((a,l)=>a+n2(l.qty)*n2(l.price),0);tx+=tb;ex+=c.sub-tb}t+=c.tax});return `<tr><td>${new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</td><td class="num">${money(tx)}</td><td class="num">${money(ex)}</td><td class="num">${money(t)}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  return pageHead('Money','Day-to-day books: what came in, what went out, who owes you.')+`<div class="tabs">${tabs.map(([k,l])=>`<button data-mtab="${k}" class="${UI.money===k?'on':''}">${l}</button>`).join('')}</div>`+body;
};

/* ---------- main events ---------- */
const main=$('#main');
main.addEventListener('input',e=>{const k=e.target.dataset.q;if(k!=null){UI.q[k]=e.target.value;schedule()}});
main.addEventListener('click',e=>{
  const t=e.target.closest('[data-chip],[data-new],[data-neworder],[data-open],[data-cmode],[data-mtab],[data-savesettings],[data-export],[data-changepw]');if(!t)return;
  if(t.dataset.chip){UI.filter[t.dataset.chip]=t.dataset.v;render()}
  else if(t.dataset.new){openForm(t.dataset.new)}
  else if(t.hasAttribute('data-neworder')){openOrder()}
  else if(t.dataset.open){t.dataset.open==='orders'?openOrder(t.dataset.id):openForm(t.dataset.open,t.dataset.id)}
  else if(t.dataset.cmode){UI.custMode=t.dataset.cmode;render()}
  else if(t.dataset.mtab){UI.money=t.dataset.mtab;render()}
  else if(t.hasAttribute('data-savesettings')){saveSettings()}
  else if(t.dataset.export){exportCsv(t.dataset.export)}
  else if(t.hasAttribute('data-changepw')){changePassword()}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-open]'))e.target.click()});
main.addEventListener('change',e=>{if(e.target.id==='imp_file'&&e.target.files[0])importCsv(e.target.files[0],$('#imp_coll').value)});

/* ---------- writes ---------- */
function need(){if(!db){toast('Not connected to the database');return false}return true}
async function saveSettings(){
  if(!need())return;
  const g=id=>document.getElementById(id).value.trim();
  const data={...settings,companyName:g('s_companyName'),address:g('s_address'),phone:g('s_phone'),email:g('s_email'),taxRate:Number(g('s_taxRate')||0),warrantyDays:Number(g('s_warrantyDays')||90),terms:document.getElementById('s_terms').value};
  try{await db.doc('settings/company').set(data);toast('Company details saved')}catch(err){toast('Could not save: '+(err&&err.message||err.code||'error'))}
}

/* ---------- generic drawer ---------- */
function fieldHTML(f,val){
  const id='f_'+f.k, v=val??'';let input;
  switch(f.t){
    case 'textarea':input=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;break;
    case 'select':input=`<select id="${id}">${f.blank===false?'':'<option value=""></option>'}${f.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'ref':input=`<select id="${id}"><option value="">—</option>${refItems(f.ref).map(([i,l])=>`<option value="${esc(i)}" ${i===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;break;
    case 'check':input=`<label class="check"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.hint||'')}</label>`;break;
    case 'money':case 'number':input=`<input id="${id}" type="number" step="${f.t==='money'?'0.01':'any'}" inputmode="decimal" value="${v===''||v==null?'':esc(v)}">`;break;
    case 'date':input=`<input id="${id}" type="date" value="${esc(v)}">`;break;
    case 'url':input=`<input id="${id}" type="url" value="${esc(v)}">`;break;
    default:input=`<input id="${id}" type="text" value="${esc(v)}">`;
  }
  return `<div class="fld ${f.w?'half':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${input}${f.help?`<small>${esc(f.help)}</small>`:''}</div>`;
}
function readField(f){const el=document.getElementById('f_'+f.k);if(!el)return undefined;if(f.t==='check')return el.checked;if(f.t==='money'||f.t==='number')return el.value===''?null:Number(el.value);return el.value.trim()}
function closeDrawer(){drawer=null;$('#drawerRoot').innerHTML=''}
function shell(title,body,foot){
  $('#drawerRoot').innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h2>${title}</h2><button class="btn ghost" data-close aria-label="Close">Close</button></div><div class="db" id="dbody">${body}</div><div class="df">${foot}</div></aside>`;
  $('#drawerRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer)closeDrawer()});
function armDelete(btn,fn){btn.onclick=()=>{if(btn.classList.contains('armed'))fn();else{btn.classList.add('armed');btn.textContent='Confirm delete';setTimeout(()=>{btn.classList.remove('armed');btn.textContent='Delete'},4000)}}}

function openForm(coll,id,preset){
  const cfg=COLL[coll];const doc=id?byId(coll,id):{...(cfg.defaults?cfg.defaults():{}),...(preset||{})};
  if(!doc)return;
  drawer={kind:'form',coll,id};
  const title=id?(coll==='units'?`<span class="tag">${esc(doc.tag||'')}</span> ${esc(utitle(doc))}`:esc(LABEL[coll]?LABEL[coll](doc):(coll==='jobs'?(doc.num+' · '+(doc.type||'Job')):(doc.vendor||cfg.one)))):'New '+cfg.one.toLowerCase();
  const body=`<div class="fgrid">${cfg.fields.map(f=>fieldHTML(f,doc[f.k])).join('')}</div>${EXTRA[coll]?EXTRA[coll](doc,id):''}`;
  const foot=canWrite?`<div class="grp"><button class="btn primary" id="fsave">${id?'Save changes':'Create'}</button><button class="btn" data-close>Cancel</button></div>${id?'<button class="btn danger" id="fdel">Delete</button>':''}`:'<button class="btn" data-close>Close</button>';
  shell(title,body,foot);
  if(!canWrite)$('#dbody').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
  const sv=$('#fsave');if(sv)sv.onclick=()=>saveForm(coll,id);
  const dl=$('#fdel');if(dl)armDelete(dl,()=>delDoc(coll,id));
  if(BIND[coll])BIND[coll](doc,id);
}
async function saveForm(coll,id){
  if(!need())return;
  const cfg=COLL[coll],data={};
  for(const f of cfg.fields){const v=readField(f);if(v!==undefined)data[f.k]=v}
  const miss=cfg.fields.find(f=>f.req&&(data[f.k]===''||data[f.k]==null));
  if(coll==='customers'&&!data.company&&!data.name){toast('Enter a business name or a contact name');return}
  if(miss){toast(miss.l+' is required');document.getElementById('f_'+miss.k)?.focus();return}
  const btn=$('#fsave');btn.disabled=true;
  try{
    if(id)await db.doc(coll+'/'+id).update(data);
    else await db.collection(coll).doc().set({...data,createdAt:new Date().toISOString()});
    toast(id?'Saved':cfg.one+' created');closeDrawer();
  }catch(err){btn.disabled=false;toast(err&&err.code==='quota_exceeded'?'Storage is full. Delete old records to add more.':'Could not save: '+(err&&(err.message||err.code)||'error'))}
}
async function delDoc(coll,id){
  if(!need())return;
  try{await db.doc(coll+'/'+id).delete();toast('Deleted');closeDrawer()}catch(err){toast('Could not delete: '+(err.message||err.code))}
}

/* extra panels inside drawers */
const EXTRA={

async function saveOrder(){
  if(!need())return;
  const d=drawer.draft, id=drawer.id;
  if(!d.customerId){toast('Choose a customer');$('#o_cust').focus();return}
  if(d.status==='invoiced'&&!d.invoiceDate)d.invoiceDate=today();
  const dup=S.orders.find(o=>o.number==d.number&&o.id!==id);if(dup){toast('Number #'+d.number+' is already used');return}
  const data={...d};data.lines=d.lines.map(l=>({unitId:l.unitId||'',productId:l.productId||'',desc:l.desc||'',qty:l.qty==null?1:n2(l.qty),price:l.price==null?0:n2(l.price),cost:l.cost==null?null:n2(l.cost),taxable:l.taxable!==false}));
  const btn=$('#osave');btn.disabled=true;
  try{
    let oid=id;
    if(id)await db.doc('orders/'+id).set(data);
    else{const ref=db.collection('orders').doc();oid=ref.id;data.createdAt=new Date().toISOString();await ref.set(data)}
    await syncUnits(oid,data,drawer.prevUnits);
    toast(id?'Saved':'#'+data.number+' created');closeDrawer();
  }catch(err){btn.disabled=false;toast('Could not save: '+(err&&(err.message||err.code)||'error'))}
}
async function syncUnits(oid,o,prev){
  const cur=o.lines.map(l=>l.unitId).filter(Boolean);
  const sold=o.status==='order'||o.status==='invoiced';
  for(const uid of cur){const u=byId('units',uid);if(!u)continue;
    if(sold&&(u.status!=='Sold'||u.orderId!==oid))await db.doc('units/'+uid).update({status:'Sold',orderId:oid,soldDate:o.invoiceDate||o.date||today()});
    if(!sold&&u.orderId===oid&&u.status==='Sold')await db.doc('units/'+uid).update({status:'Available',orderId:'',soldDate:''});
  }
  for(const uid of (prev||[])){if(cur.includes(uid))continue;const u=byId('units',uid);if(u&&u.orderId===oid)await db.doc('units/'+uid).update({status:'Available',orderId:'',soldDate:''})}
}
async function deleteOrder(){
  if(!need())return;const id=drawer.id;
  try{await syncUnits(id,{lines:[],status:'void'},drawer.prevUnits);await db.doc('orders/'+id).delete();toast('Deleted');closeDrawer()}catch(err){toast('Could not delete: '+(err.message||err.code))}
}

${c.paid?`<div><span>Paid</span><span>${money(c.paid)}</span></div><div class="g"><span>Balance due</span><span>${money(c.balance)}</span></div>`:''}</div>

${s.terms?`<div class="terms">${e(s.terms)}</div>`:''}
</body></html>`;
  saveFile(`${kind.replace(' ','-')}-${o.number}.html`,html);
}
function saveFile(name,data){
  const type=name.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
  const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---------- CSV ---------- */
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(head,rows){return [head.map(csvCell).join(','),...rows.map(r=>r.map(csvCell).join(','))].join('\r\n')}
function exportCsv(k){
  let head,rows;
  if(COLL[k]){const f=COLL[k].fields;head=['id',...f.map(x=>x.l)];rows=S[k].map(d=>[d.id,...f.map(x=>{const v=d[x.k];if(x.t==='ref'){const r=byId(x.ref,v);return r?LABEL[x.ref](r):''}return v})]);
    if(k==='units'){head.push('Landed cost','Sold date','Sale #');S.units.forEach((u,i)=>{const o=byId('orders',u.orderId);rows[i].push(landed(u),u.soldDate||'',o?o.number:'')})}}
  else if(k==='orders'){head=['Number','Stage','Customer','Date','Invoice date','Delivered','Subtotal','Tax','Total','Paid','Balance','Cost of goods','Gross profit','Tax exempt'];rows=S.orders.map(o=>{const c=calc(o);return [o.number,ostatus(o),custName(o.customerId),o.date,o.invoiceDate||'',o.deliveredDate||'',c.sub,c.tax,c.total,c.paid,c.balance,c.cost,c.profit,o.taxExempt?'yes':'no']})}
  else if(k==='lines'){head=['Number','Stage','Customer','Invoice date','Unit tag','Description','Qty','Price','Amount','Cost','Taxable'];rows=[];S.orders.forEach(o=>(o.lines||[]).forEach(l=>rows.push([o.number,ostatus(o),custName(o.customerId),o.invoiceDate||o.date,(byId('units',l.unitId)||{}).tag||'',l.desc,l.qty,l.price,n2(l.qty)*n2(l.price),l.cost??'',l.taxable!==false?'yes':'no'])))}
  else if(k==='payments'){head=['Date','Invoice','Customer','Method','Note','Amount'];rows=[];S.orders.forEach(o=>(o.payments||[]).forEach(p=>rows.push([p.date,o.number,custName(o.customerId),p.method,p.note||'',p.amount])))}
  if(!rows||!rows.length){toast('Nothing to export yet');return}
  saveFile(`${k}-${today()}.csv`,toCsv(head,rows));
}
function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const ALIAS={title:['description','item','equipment','desc'],model:['model #','model number','model no','mfr model'],brand:['manufacturer','mfr','make'],serial:['serial #','serial number','s/n','sn'],price:['asking','asking price','sell price','sale price'],cost:['our cost','cost price','paid'],listPrice:['list','list price','msrp','new list','new list price'],dealerCost:['dealer cost','net','net price'],name:['product name','item name'],company:['business','business name','company'],phone:['phone #','tel','telephone'],dims:['dimensions','size']};
async function importCsv(file,coll){
  const say=(m,done)=>{UI.importMsg=m;UI.importBusy=!done;render()};
  if(!need())return;
  const text=await file.text();const rows=parseCsv(text);if(rows.length<2){say('That file has no data rows.',true);return}
  const head=rows[0].map(h=>h.replace(/^\ufeff/,'').trim().toLowerCase());const fields=COLL[coll].fields.filter(f=>f.t!=='ref'&&f.t!=='check');
  const map=fields.map(f=>{let i=head.indexOf(f.k.toLowerCase());if(i<0)i=head.indexOf(f.l.toLowerCase());if(i<0)(ALIAS[f.k]||[]).some(a=>{i=head.indexOf(a);return i>=0});if(coll==='products'&&f.k==='name'&&i<0)i=head.indexOf('description');return [f,i]}).filter(x=>x[1]>=0);
  if(!map.length){say('None of the column headers matched. Rename them to match the field names (e.g. Brand, Model, Price) and try again.',true);return}
  say(`Matched ${map.map(([f])=>f.l).join(', ')}. Importing ${rows.length-1} rows…`);
  const key=d=>coll==='products'?((d.brand||'')+'|'+(d.model||'')).toLowerCase():coll==='units'?(d.serial||d.tag||'').toLowerCase():coll==='customers'?((d.company||'')+'|'+(d.name||'')).toLowerCase():(d.name||'').toLowerCase();
  const existing=new Set(S[coll].map(key).filter(k=>k&&k!=='|'));
  let next=coll==='units'?nextNum('units','tag',1001):0, skipped=0;const docs=[];
  for(const r of rows.slice(1)){const d={createdAt:new Date().toISOString()};
    for(const [f,i] of map){let v=(r[i]||'').trim();if(f.t==='money'||f.t==='number'){v=v.replace(/[$,\s]/g,'');d[f.k]=v===''?null:Number(v);if(isNaN(d[f.k]))d[f.k]=null}else if(f.t==='select'){const m=f.opts.find(o=>o.toLowerCase()===v.toLowerCase());d[f.k]=m||(v?(f.opts.includes('Other')?'Other':''):'')}else d[f.k]=v}
    if(coll==='units'){if(!d.tag)d.tag='U-'+(next++);if(!d.status)d.status='Available';if(!d.dateIn)d.dateIn=today();if(!d.title)d.title=[d.brand,d.model].filter(Boolean).join(' ')}
    if(coll==='customers'&&!d.stage)d.stage='Customer';
    const k=key(d);if(k&&k!=='|'&&existing.has(k)){skipped++;continue}if(k)existing.add(k);
    docs.push(d)}
  try{
    for(let i=0;i<docs.length;i+=100){await db.collection(coll).setMany(docs.slice(i,i+100));say(`Imported ${Math.min(i+100,docs.length)} of ${docs.length}…`)}
    say(`Imported ${docs.length} records${skipped?` (${skipped} skipped as already in the list)`:''}.`,true);toast(`Imported ${docs.length} records`);
  }catch(err){say(`Stopped: ${err.code==='quota_exceeded'?'storage limit reached':(err.message||err.code)}.`,true)}
  const inp=$('#imp_file');if(inp)inp.value='';
}

/* ---------- Supabase data layer (same shape the app was written against) ---------- */
let sb=null, me=null, authMode='login';
const TABLES=[...Object.keys(S),'settings'];
const cache={};TABLES.forEach(t=>cache[t]=new Map());
const listeners={};TABLES.forEach(t=>listeners[t]=new Set());
function row2doc(r){return {id:r.id,exists:true,data:()=>r.data||{}}}
function emit(t){const docs=[...cache[t].values()].map(row2doc);const snap={docs,size:docs.length,empty:!docs.length};listeners[t].forEach(fn=>{try{fn(snap)}catch(e){console.error(e)}})}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function fail(e){const err=new Error(e&&e.message||'Request failed');err.code=e&&e.code||'unavailable';lastErr=(e&&(e.code?e.code+': ':'')+(e.message||''))||String(e);return err}
function split(path){const p=path.split('/');if(p.length!==2||!TABLES.includes(p[0]))throw new TypeError('Bad path '+path);return p}
function docRef(t,id){
  id=id||uuid();
  return {id,path:t+'/'+id,
    async get(){const r=cache[t].get(id);if(r)return row2doc(r);const {data,error}=await sb.from(t).select('*').eq('id',id).maybeSingle();if(error)throw fail(error);return data?row2doc(data):{id,exists:false,data:()=>undefined}},
    async set(data){const row={id,data,updated_at:new Date().toISOString()};const {error}=await sb.from(t).upsert(row);if(error)throw fail(error);cache[t].set(id,row);emit(t)},
    async update(patch){const cur=cache[t].get(id);let base=cur?cur.data:null;if(!base){const {data,error}=await sb.from(t).select('data').eq('id',id).maybeSingle();if(error)throw fail(error);if(!data)throw Object.assign(new Error('No such record'),{code:'invalid_argument'});base=data.data}const merged={...base,...patch};const row={id,data:merged,updated_at:new Date().toISOString()};const {error}=await sb.from(t).update(row).eq('id',id);if(error)throw fail(error);cache[t].set(id,row);emit(t)},
    async delete(){const {error}=await sb.from(t).delete().eq('id',id);if(error)throw fail(error);cache[t].delete(id);emit(t)},
    onSnapshot(next,err){const fn=()=>{const r=cache[t].get(id);next(r?row2doc(r):{id,exists:false,data:()=>undefined})};listeners[t].add(fn);if(loaded[t])fn();return ()=>listeners[t].delete(fn)}
  };
}
const loaded={};
const dbApi={
  doc(path){const [t,id]=split(path);return docRef(t,id)},
  collection(t){if(!TABLES.includes(t))throw new TypeError('Bad collection '+t);return {path:t,doc:id=>docRef(t,id),add:d=>{const r=docRef(t);return r.set(d).then(()=>r)},async setMany(list){const now=new Date().toISOString();const rows=list.map(d=>({id:uuid(),data:d,updated_at:now}));const {error}=await sb.from(t).upsert(rows);if(error)throw fail(error);rows.forEach(r=>cache[t].set(r.id,r));emit(t)},onSnapshot(next,err){listeners[t].add(next);if(loaded[t])next({docs:[...cache[t].values()].map(row2doc)});return ()=>listeners[t].delete(next)}}}
};
async function loadTable(t){
  const {data,error}=await sb.from(t).select('*').order('created_at',{ascending:true});
  if(error)throw fail(error);
  cache[t]=new Map(data.map(r=>[r.id,r]));loaded[t]=true;emit(t);
}
/* Live sync is best-effort: the status light only reflects whether reads and saves work.
   If the realtime channel drops, we poll more often and quietly try to reconnect. */
let channel=null, pollTimer=0, live=false, retryTimer=0, listenersBound=false;
async function connectData(){
  conn='connecting';render();
  try{await Promise.all(TABLES.map(loadTable));conn='ok';lastErr=''}catch(e){console.error(e);if(!lastErr)lastErr=String(e&&e.message||e);conn='off'}
  render();
  openChannel();
  setPolling();
  if(!listenersBound){listenersBound=true;
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshAll();if(!live)openChannel()}});
    window.addEventListener('online',()=>{refreshAll();openChannel()});
  }
}
function openChannel(){
  clearTimeout(retryTimer);
  if(channel){try{sb.removeChannel(channel)}catch(_){}channel=null}
  channel=sb.channel('all-tables-'+Date.now());
  TABLES.forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    if(p.eventType==='DELETE'){cache[t].delete(p.old.id)}else{cache[t].set(p.new.id,p.new)}
    emit(t);
  }));
  channel.subscribe(status=>{
    if(status==='SUBSCRIBED'){live=true;setPolling();refreshAll()}
    else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){live=false;setPolling();clearTimeout(retryTimer);retryTimer=setTimeout(openChannel,15000)}
  });
}
function setPolling(){clearInterval(pollTimer);pollTimer=setInterval(refreshAll,live?60000:15000)}
let refreshing=false;
async function refreshAll(){if(!sb||!me||refreshing)return;refreshing=true;try{await Promise.all(TABLES.map(loadTable));if(conn!=='ok'){conn='ok';lastErr='';schedule()}}catch(e){console.error(e);if(!lastErr)lastErr=String(e&&e.message||e);if(conn!=='off'){conn='off';schedule()}}refreshing=false}

/* ---------- auth screens ---------- */
function showAuth(mode,msg,isErr){
  authMode=mode;$('#shell').hidden=true;const a=$('#auth');a.hidden=false;
  const brand=`<div class="brand">GMI Equipment<small>Back office</small></div>`;
  let form='';
  if(mode==='login')form=`<form id="authform"><div class="fgrid"><div class="fld"><label for="a_email">Email</label><input id="a_email" type="email" autocomplete="username" required></div><div class="fld"><label for="a_pw">Password</label><input id="a_pw" type="password" autocomplete="current-password" required></div></div><div style="margin-top:16px"><button class="btn primary" type="submit">Sign in</button></div></form><button class="authlink" data-amode="forgot">Forgot your password?</button>`;
  else if(mode==='forgot')form=`<form id="authform"><div class="fgrid"><div class="fld"><label for="a_email">Email</label><input id="a_email" type="email" required></div></div><div style="margin-top:16px"><button class="btn primary" type="submit">Email me a reset link</button></div></form><button class="authlink" data-amode="login">Back to sign in</button>`;
  else if(mode==='setpw')form=`<p class="small muted">Choose a password for your account.</p><form id="authform"><div class="fgrid"><div class="fld"><label for="a_pw">New password</label><input id="a_pw" type="password" autocomplete="new-password" minlength="8" required></div></div><div style="margin-top:16px"><button class="btn primary" type="submit">Save password and continue</button></div></form>`;
  a.innerHTML=`<div class="authcard">${brand}${form}<div class="authmsg ${isErr?'err':''}" id="authmsg">${esc(msg||'')}</div></div>`;
  const f=$('#authform');if(f)f.onsubmit=async ev=>{ev.preventDefault();const btn=f.querySelector('button');btn.disabled=true;const m=$('#authmsg');m.className='authmsg';m.textContent='';
    try{
      if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email:$('#a_email').value.trim(),password:$('#a_pw').value});if(error)throw error}
      else if(mode==='forgot'){const {error}=await sb.auth.resetPasswordForEmail($('#a_email').value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;m.textContent='If that address has an account, a reset link is on its way.'}
      else if(mode==='setpw'){const {error}=await sb.auth.updateUser({password:$('#a_pw').value});if(error)throw error;pendingSetPw=false;enterApp()}
    }catch(err){m.className='authmsg err';m.textContent=err.message==='Invalid login credentials'?'Wrong email or password.':(err.message||'Something went wrong')}
    btn.disabled=false};
  a.querySelectorAll('[data-amode]').forEach(b=>b.onclick=()=>showAuth(b.dataset.amode));
  const first=a.querySelector('input');if(first)first.focus();
}
let pendingSetPw=false;
let wired=false;
function enterApp(){$('#auth').hidden=true;$('#shell').hidden=false;db=dbApi;
  if(!wired){wired=true;
    for(const c of Object.keys(S))db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(x=>({id:x.id,...x.data()}));schedule()});
    db.doc('settings/company').onSnapshot(sn=>{settings=sn.exists?{...sn.data()}:{};schedule()});
  }
  render();connectData()}
async function signOut(){await sb.auth.signOut();location.reload()}
async function changePassword(){const pw=$('#pw_new').value;if(pw.length<8){toast('Use at least 8 characters');return}const {error}=await sb.auth.updateUser({password:pw});toast(error?error.message:'Password changed');if(!error)$('#pw_new').value=''}

/* ---------- boot ---------- */
const VALID=VIEWS.map(v=>v[0]);
const h0=location.hash||'';
try{const h=h0.slice(1);if(VALID.includes(h))UI.view=h}catch(_){}
if(/type=(invite|recovery|signup|magiclink)/.test(h0))pendingSetPw=/type=(invite|recovery)/.test(h0);
(async()=>{
  if(!window.supabase||!window.SUPABASE_URL||window.SUPABASE_URL.startsWith('__')){showAuth('login','This page is not configured yet: the Supabase URL and key are missing.',true);return}
  sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    me=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY'){pendingSetPw=true}
    if(!me){if(!$('#auth').hidden&&authMode!=='login'&&ev!=='SIGNED_OUT')return;showAuth('login');return}
    if(pendingSetPw){showAuth('setpw');return}
    if($('#shell').hidden)enterApp();
  });
  const {data:{session}}=await sb.auth.getSession();
  if(!session)showAuth('login');
})();
})();
